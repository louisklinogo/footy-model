version: 1
family: scoreline
description: Experimental scoreline contract approximating the active live goal-market signal family without scoreline-only availability or baseline extras.

required_features:
  - home_sample_size
  - away_sample_size
  - home_rolling_xg
  - home_rolling_xg_against
  - away_rolling_xg
  - away_rolling_xg_against
  - home_rolling_sot
  - away_rolling_sot
  - lambda_home_l1
  - lambda_away_l1
  - adj_lambda_home_final
  - adj_lambda_away_final
  - xg_net_diff
  - goal_diff_proxy

optional_features:
  - home_rolling_big_chances
  - away_rolling_big_chances
  - home_rolling_xgot
  - away_rolling_xgot
  - home_rolling_possession
  - away_rolling_possession
  - home_defenders
  - home_midfielders
  - home_forwards
  - away_defenders
  - away_midfielders
  - away_forwards
  - style_delta
  - rule_fired_home
  - rule_fired_away
  - odds_over_15
  - odds_under_15
  - odds_over_25
  - odds_under_25
  - odds_over_35
  - odds_under_35
  - implied_over15
  - implied_under15
  - implied_over25
  - implied_under25
  - implied_over35
  - implied_under35
  - odds_gap_15
  - odds_gap_25
  - odds_gap_35

missingness_indicators:
  - lambda_home_l1_is_missing
  - lambda_away_l1_is_missing
  - home_sample_size_is_missing
  - away_sample_size_is_missing
  - adj_lambda_home_final_is_missing
  - adj_lambda_away_final_is_missing

forbidden_cross_family_features:
  - odds_c75_over
  - odds_c85_over
  - odds_c95_over
  - odds_c105_over
  - corners_gap_75
  - corners_gap_85
  - corners_gap_95
  - corners_gap_105