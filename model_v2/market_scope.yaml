version: 1
name: linchpin_scope_v2
description: Core runtime market scope for v2 re-architecture.

contracts:
  handicap: handicap_contract.yaml

notes:
  - The flat markets list below remains the current runtime-enabled scope for v2 tooling.
  - Canonical sportsbook handicap semantics live in model_v2/handicap_contract.yaml.
  - Current EH repo codes are legacy binary proxies and not full European handicap 3-way markets.

families:
  scoreline_directional:
    contract_references:
      - feature_contracts/scoreline.yaml
      - handicap_contract.yaml
    markets:
      - 1x2_h
      - 1x2_d
      - 1x2_a
      - dc_1x
      - dc_x2
      - dc_12
      # Canonical Asian handicap selections for the current displayed lines.
      - ah2_home_m05
      - ah2_away_p05
      - ah2_away_m05
      - ah2_home_p05
      - ah2_home_m15
      - ah2_away_p15
      - ah2_away_m15
      - ah2_home_p15
      # Canonical European handicap 3-way selections for the current displayed lines.
      - eh3_0_1_home
      - eh3_0_1_draw
      - eh3_0_1_away
      - eh3_1_0_home
      - eh3_1_0_draw
      - eh3_1_0_away
